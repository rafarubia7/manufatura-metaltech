server:
  port: 0

spring:
  application:
    name: metaltech-monitoramento-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    com.metaltech.monitoramento: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
