# Ambiente local do MetalTech
#   Somente o banco (backend rodando via ./mvnw):  docker compose up -d mysql
#   Banco + backend em contêiner:                  docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: metaltech-mysql
    environment:
      MYSQL_DATABASE: metaltech
      MYSQL_USER: metaltech
      MYSQL_PASSWORD: metaltech123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - metaltech-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: metaltech-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/metaltech?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: metaltech
      DB_PASSWORD: metaltech123
    ports:
      - "8080:8080"

volumes:
  metaltech-mysql-data:
