# Ambiente local do MetalTech
#   Somente o banco (backend rodando via ./mvnw):  docker compose up -d postgres
#   Banco + backend em contêiner:                  docker compose up -d --build
services:
  postgres:
    image: postgres:15-alpine
    container_name: metaltech-postgres
    environment:
      POSTGRES_DB: metaltech
      POSTGRES_USER: metaltech
      POSTGRES_PASSWORD: metaltech123
    ports:
      - "5432:5432"
    volumes:
      - metaltech-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaltech -d metaltech"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: metaltech-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/metaltech
      DB_USERNAME: metaltech
      DB_PASSWORD: metaltech123
    ports:
      - "8080:8080"

volumes:
  metaltech-pgdata:
