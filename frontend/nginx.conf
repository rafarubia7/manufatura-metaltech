# Serve o build do dashboard. As rotas (/analise, /ocorrencias, /usuarios) são
# do navegador (React Router), então qualquer caminho desconhecido devolve o index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome (gerados pelo Vite) podem ficar em cache por bastante tempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html nunca fica em cache, para o navegador sempre pegar a versão nova
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
